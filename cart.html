<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | Gadget Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--HEADER-->
    <header>
      <h1>Gadget Store</h1>

      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#products">Products</a></li>
          <li><a href="cart.html">Cart</a></li>
        </ul>
      </nav>
    </header>

    <!-- CART MAIN CONTENT-->
    <main class="cart-main">
      <section class="cart-section">
        <h2>Shopping Cart</h2>
        <p>This is a static cart preview.</p>

        <!--CART GRID-->
        <div class="cart-grid">
          <article class="cart-item">
            <!-- Column 1: product information -->
            <div class="cart-product-info">
              <img src="images/MacBook_Pro.png" alt="MacBook Pro laptop" />
              <div class="cart-product-text">
                <h3>MacBook Pro</h3>
                <p><strong>Price:</strong>12,500 SEK</p>
                <p><strong>Quantity:</strong>1</p>
              </div>
            </div>

            <!-- Column 2: Remove button -->
            <div class="remove-cell">
              <button class="remove-button"type="button"aria-label="Remove MacBook Pro from cart">
                Remove
              </button>
            </div>
          </article>

          <article class="cart-item">
            <!-- Column 1: product information -->
            <div class="cart-product-info">
              <img src="images/airpods-max.png" alt="Wireless headphones" />
              <div class="cart-product-text">
                <h3>Wireless Headphones</h3>
                <p> <strong>Price:</strong>1,500 SEK</p>
                <p><strong>Quantity:</strong>1</p>
              </div>
            </div>

            <!-- Column 2: Remove button -->
            <div class="remove-cell">
              <button
                class="remove-button"type="button" aria-label="Remove Wireless Headphones from cart">
                Remove
              </button>
            </div>
          </article>
        </div>

        <!-- CART TOTAL -->
        <div class="cart-summary">
          <h3>Total: 14,000 SEK</h3>
          <!-- Navigation buttons -->
          <a href="index.html" class="continue-button">Continue Shopping</a>
          <a href="#" class="checkout-button">Checkout</a>
        </div>
      </section>
    </main>

    <!--FOOTER-->
    <footer>
      <p>
        Contact us:
        <a href="mailto:gadgetstore@gmail.com">gadgetstore@gmail.com</a>
      </p>
      <p>Telephone: +46 70 123 45 67</p>
    </footer>
  </body>
</html>
